name: Обробка фото галереї
on:
  push:
    paths:
      - "images/gallery/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif
      - run: python tools/build_gallery.py images/gallery
      - name: Зберегти результат
        run: |
          git config user.name "gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add -A images/gallery
          git diff --cached --quiet || git commit -m "Авто: обробка фото галереї"
          git push
